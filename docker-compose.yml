
services:

  app:

    build: .

    container_name: ecommerce-backend

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - postgres

  postgres:

    image: postgres:17

    container_name: ecommerce-postgres

    restart: always

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: kiran@7368

      POSTGRES_DB: ecommerce_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data: